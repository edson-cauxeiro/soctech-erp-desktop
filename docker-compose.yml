services:
  postgres:
    image: postgres:16-alpine
    container_name: doraerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doraerp_db}
      POSTGRES_USER: ${POSTGRES_USER:-doraerp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doraerp_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doraerp_user} -d ${POSTGRES_DB:-doraerp_db} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - doraerp_network

  # Adminer — interface web leve para gerir a base de dados (opcional, apenas em desenvolvimento)
  adminer:
    image: adminer:latest
    container_name: doraerp_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - doraerp_network

volumes:
  postgres_data:
    driver: local

networks:
  doraerp_network:
    driver: bridge
